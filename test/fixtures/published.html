<div id="map"></div>
<script>
// Data lines. The save endpoint rewrites exactly these three and nothing else.
const OFFICES={"ADE":{"name":"Adelaide","color":"#00a2ff","lat":-34.9,"lng":138.6,"address":"1 King William St, Adelaide SA"},"GC":{"name":"Gold Coast","color":"#ff5733","lat":-28.0,"lng":153.4,"address":"2 Surf Pde, Broadbeach QLD"}};
const ZONES=[{"name":"ADE 1","folder":"SA","office":"ADE","coords":[[-34.8,138.5],[-34.7,138.6],[-34.9,138.7],[-34.8,138.5]],"label":"1","labelPos":[-34.8,138.6],"labelSize":0.02},{"name":"GC 1","folder":"QLD","office":"GC","coords":[[-28.0,153.3],[-27.9,153.4],[-28.1,153.5],[-28.0,153.3]],"label":"1","labelPos":[-28.0,153.4],"labelSize":0.02}];
const STATE_GROUPS={"QLD":["GC"],"SA":["ADE"]};
const map = L.map('map').setView([-27, 140], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
for (const z of ZONES) {
  L.polygon(z.coords, { color: OFFICES[z.office].color, weight: 2 }).addTo(map).bindTooltip(escapeHtml(z.name));
}
