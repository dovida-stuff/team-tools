# Lets Cloudflare deploy this Worker straight from the repo (Workers Builds).
# "name" must match the Worker's name in the Cloudflare dashboard exactly.
name = "doivda-map-save"
main = "save-worker.js"
compatibility_date = "2025-09-01"

# Keep variables set in the dashboard (such as ALLOWED_ORIGIN) when deploying.
# Secrets (GITHUB_TOKEN, EDIT_PASSWORD) are never touched by a deploy.
keep_vars = true
